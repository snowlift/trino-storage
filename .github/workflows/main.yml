name: CI

on: [push, pull_request]

env:
  HADOOP_USER_NAME: hive

jobs:
  maven-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'
      - name: Configure Problem Matchers
        run: |
          echo "::add-matcher::.github/problem-matcher.json"
          echo "::remove-matcher owner=java::"

      - name: Get Trino version
        id: trino_tag
        run: |
          trino_tag=$(./mvnw -B help:evaluate -Dexpression=dep.trino.version -q -DforceStdout)
          echo "trino_tag=$trino_tag" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: trinodb/trino
          path: trino
          ref: ${{ steps.trino_tag.outputs.trino_tag }}
      - name: Build Trino
        run: cd trino && ./mvnw -B install -DskipTests -Dair.check.skip-all -Dskip.npm -pl ':trino-filesystem,:trino-hdfs,:trino-memory-context,:trino-orc,:trino-parquet,:trino-plugin-toolkit,:trino-main,:trino-testing,:trino-testing-services,:trino-tpch' -am

      - name: Maven Checks
        run: |
          ./mvnw -B clean install
      - name: Annotate run
        uses: trinodb/github-actions/action-surefire-report@b63800bedfbc7ab1ff2e5fe7eaecf5ab82ce6a70
        if: always()
        with:
          fail_if_no_tests: false
          skip_publishing: true
